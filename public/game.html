<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkers Game</title>
  <link rel="stylesheet" href="css/game.css">
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/checkers-ai-working.js"></script>
</head>
<body>
  <h1 class="main-title">Checkers</h1>
  
  <div class="main-container">
    <!-- Left Panel: Game Info -->
    <div class="side-panel left-panel">
      <div class="panel-section">
        <h3>Game Info</h3>
        <div id="join-url-section">
          <div id="join-url"></div>
          <div class="url-buttons">
            <button id="copy-url-btn">Copy URL</button>
            <button id="play-ai-btn">Play AI</button>
          </div>
        </div>
      </div>
      
      <div class="panel-section">
        <h3>Controls</h3>
        <div id="controls">
          <button id="print-btn">Print Moves</button>
        </div>
      </div>
      
      <div class="panel-section">
        <h3>Status</h3>
        <div id="game-status"></div>
      </div>
      
      <div class="panel-section">
        <h3>Move History</h3>
        <div id="move-history-container">
          <ol id="move-history"></ol>
        </div>
      </div>
    </div>
    
    <!-- Center: Game Board -->
    <div class="center-panel">
      <div id="game-board"></div>
    </div>
    
    <!-- Right Panel: Chat & Video -->
    <div class="side-panel right-panel">
      <div class="panel-section video-section">
        <h3>Video Chat</h3>
        <div id="video-container" class="video-container">
          <div class="video-content">
            <div class="video-grid-stacked">
              <div class="video-item">
                <div class="video-wrapper">
                  <video id="local-video" autoplay muted playsinline></video>
                  <div id="local-placeholder" class="video-placeholder">
                    <div class="placeholder-icon">👤</div>
                    <div class="placeholder-text">Your Camera</div>
                  </div>
                </div>
                <div class="video-label">You</div>
              </div>
              
              <div class="video-item">
                <div class="video-wrapper">
                  <video id="remote-video" autoplay playsinline></video>
                  <div id="remote-placeholder" class="video-placeholder">
                    <div class="placeholder-icon">👤</div>
                    <div class="placeholder-text">Waiting for opponent...</div>
                  </div>
                </div>
                <div class="video-label">Opponent</div>
              </div>
            </div>
            
            <div class="video-controls-bottom">
              <button id="start-video-btn" class="video-control-btn" title="Start Video Chat">📹 Start</button>
              <button id="toggle-video-btn" class="video-control-btn" title="Toggle Video" style="display:none;">🔴</button>
              <button id="toggle-audio-btn" class="video-control-btn" title="Toggle Audio" style="display:none;">🔊</button>
              <button id="leave-video-btn" class="video-control-btn danger" title="Leave Video Chat" style="display:none;">❌</button>
            </div>
            
            <div id="video-status" class="video-status">Click Start to begin video chat</div>
          </div>
        </div>
      </div>
      
      <div class="panel-section chat-section">
        <h3>Chat</h3>
        <div id="chat-container">
          <div id="chat-feedback" style="padding: 8px; background: #2a2a2a; border-radius: 4px; margin-bottom: 8px; font-size: 0.9em; color: #ffffff; border: 1px solid #444;">
            Please send comments/feedback to: <a href="mailto:maurice13stu@gmail.com" style="color: #66b3ff; text-decoration: underline;">maurice13stu@gmail.com</a>
          </div>
          <div id="chat-messages"></div>
          <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" maxlength="200" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/game.js"></script>
</body>
</html>
